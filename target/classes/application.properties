# ========================================================
# Smart Personal Finance Tracker - Application Configuration
# ========================================================

# PostgreSQL Database
spring.datasource.url=${DB_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/finance_tracker}}
spring.datasource.username=${DB_USERNAME:${DATABASE_USERNAME:postgres}}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JSON
spring.jackson.serialization.write-dates-as-timestamps=false

# Server
server.port=${PORT:8080}

# JWT Authentication
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000

# API Documentation
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Logging
logging.level.com.financetracker=INFO
logging.level.org.springframework.security=WARN
